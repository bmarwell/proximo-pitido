# Language filter: controls which language plug-ins are active and which dial digit selects each.
#
# Two formats are accepted:
#   Simple   — comma-separated BCP 47 locale tags; digits auto-assigned 1, 2, …
#              Example: de-DE,en-GB
#   Explicit — digit-first entries separated by commas: <digit>=<locale>
#              Example: 1=de-DE,2=en-GB
#
# Locale tags are normalised, so de_DE, de-de, and de-DE are all equivalent.
# Variant subtags (e.g. de-DE-myvoice) are supported.
# When blank, all discovered language plug-ins are active (may trigger a selection menu).
# Set to a single entry to bypass the menu entirely.
sip.languages.enabled=2=en-GB,8=es-AR
