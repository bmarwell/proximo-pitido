# Default Application Router (DAR) configuration for Proximo Pitido.
# Explicitly lists the SIP methods that are handled by this application.
# REGISTER is intentionally omitted: outgoing REGISTER requests should be
# forwarded to Deutsche Telekom without triggering application composition
# (which would loop the request back and produce a local 405 response).
# routeWhenNoApp=true (Liberty default) ensures un-matched methods go to the network.
INVITE: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
BYE: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
ACK: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
CANCEL: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
OPTIONS: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
SUBSCRIBE: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
NOTIFY: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
