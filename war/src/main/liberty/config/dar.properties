# Default Application Router (DAR) configuration for Proximo Pitido.
# Explicitly lists the SIP methods that are handled by this application.
# See README.adoc § "Default Application Router (DAR)" for a full explanation.
#
# REGISTER is intentionally omitted: outgoing REGISTER requests must reach the network
# without being intercepted by the DAR. If REGISTER were listed here, Liberty would create
# a server-side transaction, route the request back into the app, find no handler, and
# respond 405 — causing an infinite 405 loop and preventing registration.
#
# INFO must be listed so that DTMF keypress events (RFC 2976) reach the application
# during the language-selection menu. Without this, digit presses are silently dropped.
INVITE:  ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
BYE:     ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
ACK:     ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
CANCEL:  ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
INFO:    ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
OPTIONS: ("Proximo Pitido", "DAR:From", "NEUTRAL", "", "NO_ROUTE", "0")
