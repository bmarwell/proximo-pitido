name: Forbidden APIs check

on:
  workflow_dispatch: {}
  push:
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/forbidden-apis-check.yml'
  pull_request:
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/forbidden-apis-check.yml'

permissions:
  contents: read

jobs:
  check:
    if: github.ref_name == 'main' || github.event_name != 'push' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [25]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Check forbidden APIs
        shell: bash
        run: >
          ./mvnw
          --show-version
          --errors
          --batch-mode
          --no-transfer-progress
          compile
          forbiddenapis:check@forbidden-apis-check
          -DtrimStackTrace=false
          -Dspotless.skip=true
          -Dforbiddenapis.skip=false
