version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    groups:
      jakarta-javax-apis:
        patterns:
          - "jakarta.*:*"
          - "javax.*:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "io.openliberty.tools:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
