version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      jakarta-javax-apis:
        patterns:
          - "jakarta.*:*"
          - "javax.*:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "io.openliberty.tools:*"
      monthly-batch-maven:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      monthly-batch-actions:
        patterns:
          - "*"
